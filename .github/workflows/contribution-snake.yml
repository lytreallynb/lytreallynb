name: Generate contribution snake

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3D1F3A&color_dots=#EBEDF0,#E8C9D8,#D4A0C0,#A75D8A,#7A3B66
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F5F0E8&color_dots=#0F0F14,#3D1F3A,#7A3B66,#D4A0C0,#E8A0BF

      - name: Publish SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
